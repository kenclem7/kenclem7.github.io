# Tripwire, not a build: GitHub Pages deploys this repo regardless of what happens here.
# This exists so a weather10 edit pushed without regenerating weather3 (or a needle the
# generator can no longer find) turns into a red X on the commit instead of a silently
# stale 3 Day page. See DESIGN.md section 4.
name: check
on:
  push:
    branches: [main]
  pull_request:

# Least privilege, declared here rather than inherited. The repo default is currently
# read-only, but that is a repo setting that can be changed without anyone touching this
# file; this job only ever reads the tree.
permissions:
  contents: read

jobs:
  weather3-in-sync:
    runs-on: ubuntu-latest
    steps:
      # SHA-pinned, not @v4: a tag is mutable and can be repointed at different code.
      # This SHA is v4.4.0. Bump the SHA and the trailing comment together.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: python3 tools/gen-weather3.py --check
