<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Content-Security-Policy, same shape as the chart pages (DESIGN.md section 2) but with connect-src
     'none': this page fetches nothing and never should. unsafe-inline covers the inline redirect script,
     and the homepage's inline stylesheet. Navigation is not governed by CSP, so neither the meta refresh
     nor location.replace is affected; both were tested. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'none';
  img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';
  base-uri 'none'; object-src 'none'; form-action 'none';">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12171d" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="strict-origin-when-cross-origin">   <!-- share links carry ?lat&lon&name and the page calls out to other hosts;
     browsers already default to this, so this pins the guarantee rather than leaving it to the default -->
<meta name="robots" content="noindex, nofollow">
<title>Ken Clements</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⛵</text></svg>">
<meta http-equiv="refresh" content="0; url=https://www.linkedin.com/in/kenclements/">
<script>window.location.replace("https://www.linkedin.com/in/kenclements/");</script>
<!-- Light is left exactly as it was; only the dark half is new. color-scheme lets the UA
     paint the canvas and its own default link color, so this needs no palette of its own.
     A redirect page is on screen for one frame, and the whole job is that the frame is not
     a white flash on a dark screen. -->
<style>:root{color-scheme:light dark}
body{font-family:"Segoe UI",system-ui,sans-serif;padding:40px;color:#333}
@media (prefers-color-scheme:dark){body{background:#12171d;color:#c3ccd6}a{color:#64b0f5}}</style>
</head>
<body>
<p>Heading to <a href="https://www.linkedin.com/in/kenclements/">Ken's LinkedIn profile</a>&hellip;</p>
<p>Or check the <a href="/weather10/">10 Day Forecast</a>.</p>
</body>
</html>
